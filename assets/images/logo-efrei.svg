<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fond dégradé -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle de fond -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Lettre E -->
  <rect x="40" y="50" width="10" height="100" fill="#ffffff"/>
  <rect x="40" y="50" width="60" height="10" fill="#ffffff"/>
  <rect x="40" y="95" width="50" height="10" fill="#ffffff"/>
  <rect x="40" y="140" width="60" height="10" fill="#ffffff"/>
  
  <!-- Lettre F -->
  <rect x="110" y="50" width="10" height="100" fill="#ff6b35"/>
  <rect x="110" y="50" width="50" height="10" fill="#ff6b35"/>
  <rect x="110" y="95" width="45" height="10" fill="#ff6b35"/>
  
  <!-- Texte EFREI -->
  <text x="100" y="170" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">EFREI</text>
</svg>
